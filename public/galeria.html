<script>
const SUPABASE_URL = 'https://ffiwqkvftwosybubnerh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_t__IyaSL9g4v0HNNZjFk9Q_te0hZnos';
const STORAGE_URL = SUPABASE_URL + '/storage/v1/object/public/gallery/';

let supabase = null;
let channel = null;

function initSupabase() {
  if (window.supabase && window.supabase.createClient) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return true;
  }
  try { loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    if (window.supabase) { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return true; }
  } catch (e) { console.warn('Supabase load failed:', e); }
  return false;
}

function loadScript(src) {
  return new Promise(function(resolve, reject) {
    if (document.querySelector('script[src="' + src + '"]')) return resolve();
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function(s) { return ({'&':'&','<':'<','>':' >','"':'"','\'':'\'')[s]; });
}

function renderGallery(items) {
  var grid = document.getElementById('gallery-grid');
  var empty = document.getElementById('empty-state');
  if (!items.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = items.map(function(item) {
    var isVideo = item.is_video;
    var mediaUrl = item.url.startsWith('http') ? item.url : STORAGE_URL + item.url;
    var displayDate = item.display_date || item.date;
    var author = item.author || 'Anónimo';
    var caption = item.caption ? escapeHtml(item.caption) : '';
    var title = escapeHtml(item.title);
    return '<a class="gallery-tile reveal up" href="' + mediaUrl + '" target="_blank" rel="noopener" ' + (isVideo ? 'data-video="true"' : '') + '>' +
      (isVideo ? '<svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>' : '') +
      '<img src="' + mediaUrl + '" alt="' + title + '" loading="lazy" />' +
      '<span class="tile-caption">' + displayDate + '</span>' +
      '<span class="author-badge">👤 ' + escapeHtml(author) + '</span>' +
      (caption ? '<span class="caption-text">' + caption + '</span>' : '');
  }).join('');
  if (window.observeReveals) window.observeReveals(grid);
}

async function loadGallery() {
  if (!supabase) return;
  try {
    var r = await supabase.from('gallery_items').select('*').order('created_at', { ascending: false });
    if (r.error) throw r.error;
    renderGallery(r.data || []);
  } catch (e) { console.error('Load gallery error:', e); }
}

function subscribeRealtime() {
  if (!supabase) return;
  channel = supabase.channel('gallery_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gallery_items' }, function(payload) {
      console.log('Realtime change:', payload);
      loadGallery();
    })
    .subscribe();
}

async function init() {
  var ok = await initSupabase();
  if (ok) { await loadGallery(); subscribeRealtime(); }
  else {
    try {
      var local = JSON.parse(localStorage.getItem('th_gallery') || '[]');
      if (local.length) renderGallery(local);
    } catch (e) {}
    document.getElementById('empty-state').innerHTML = 'No hay capturas aún. <br><small style="color:var(--text-dim);">Configura Supabase para tiempo real.</small>';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
