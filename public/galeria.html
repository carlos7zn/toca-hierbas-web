<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = "https://ffiwqkvftwosybubnerh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_t__IyaSL9g4v0HNNZjFk9Q_te0hZnos";
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STORAGE_KEY = "th_gallery";

async function loadGallery() {
  let items = [];
  try {
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) items = JSON.parse(local);
  } catch (e) {}
  try {
    const { data, error } = await supabase
      .from('gallery_items')
      .select('*')
      .order('created_at', { ascending: false });
    if (!error && data) {
      const localMap = new Map(items.map(i => [i.slug, i]));
      for (const s of data) {
        if (!localMap.has(s.slug)) items.push(s);
      }
    }
  } catch (e) {}
  items.sort((a, b) => new Date(b.date) - new Date(a.date));
  return items;
}

function renderGallery(items) {
  const grid = document.getElementById("gallery-grid");
  if (!items.length) {
    grid.innerHTML = '<p class="gallery-note reveal" style="grid-column:1/-1;">No hay capturas aún.</p>';
    return;
  }
  grid.innerHTML = items.map(item => {
    const isVideo = item.is_video || (item.url && item.url.match(/\.(mp4|webm|mov)$/i));
    const mediaTag = isVideo
      ? '<video src="' + item.url + '" muted preload="metadata" playsinline></video>'
      : '<img src="' + item.url + '" alt="' + item.title + '" loading="lazy">';
    const playIcon = isVideo
      ? '<svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'
      : '';
    const tileClass = isVideo ? 'gallery-tile video-tile' : 'gallery-tile';
    const authorBadge = item.author ? '<span class="author-badge">👤 ' + item.author + '</span>' : '';
    const caption = item.caption ? '<span class="caption-text">' + item.caption + '</span>' : '';
    return (
      '<a href="' + item.url + '" class="' + tileClass + ' reveal" target="_blank" rel="noopener">' +
      mediaTag +
      playIcon +
      '<span class="tile-caption">' + (item.displayDate || item.date) + '</span>' +
      authorBadge +
      caption +
      '</a>'
    );
  }).join("");
  if (window.io) {
    document.querySelectorAll("#gallery-grid .reveal").forEach(el => window.io.observe(el));
  }
}

async function init() {
  const items = await loadGallery();
  renderGallery(items);

  // Real-time updates
  supabase
    .channel('gallery-public')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gallery_items' }, async () => {
      const items = await loadGallery();
      renderGallery(items);
    })
    .subscribe();
}

async function loadGallery() {
  let items = [];
  try {
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) items = JSON.parse(local);
  } catch (e) {}
  try {
    const { data, error } = await supabase
      .from('gallery_items')
      .select('*')
      .order('created_at', { ascending: false });
    if (!error && data) {
      const localMap = new Map(items.map(i => [i.slug, i]));
      for (const s of data) {
        if (!localMap.has(s.slug)) items.push(s);
      }
    }
  } catch (e) {}
  items.sort((a, b) => new Date(b.date) - new Date(a.date));
  return items;
}

init();
</script>
